[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acruxcore"
version = "0.6.6"
description = "Async Python SDK for Acrux Core — runtime prompt render, gateway chat, tool loops, traces, and feedback"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Acrux Core" }]
keywords = [
    "acruxcore",
    "prompt-management",
    "llm",
    "ai-gateway",
    "observability",
    "tracing",
    "sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # Exercises the pydantic-built response_format path (pydantic_response_format()).
    # pydantic is NOT a runtime dependency — it stays an optional install users opt into
    # by passing a BaseModel to response_format.
    "pydantic>=2",
    # Only needed by tests/test_byo_integration.py (the live-API integration
    # suite), to load the repo-root .env the same way the Node SDK's
    # jest.setup.ts does. No other test in this package touches the network.
    "python-dotenv>=1.0",
]

[project.urls]
# The source repo is private, so the public-facing links point at the docs site
# rather than a GitHub URL that 404s for anyone reading the PyPI page.
Homepage = "https://acruxcore.com"
Documentation = "https://docs.acruxcore.com"

[tool.hatch.build.targets.wheel]
packages = ["src/acruxcore"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
