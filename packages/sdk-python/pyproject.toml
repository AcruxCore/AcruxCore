[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acruxcore"
version = "0.9.0"
description = "Async Python SDK for AcruxCore — runtime prompt render, gateway chat, tool loops, traces, and feedback"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "AcruxCore" }]
keywords = [
    "acruxcore",
    "prompt-management",
    "llm",
    "ai-gateway",
    "observability",
    "tracing",
    "sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
# acruxcore.otel.register() — see src/acruxcore/otel.py. Framework instrumentors
# (openinference-instrumentation-crewai, etc.) are separate, per-framework installs;
# this extra is only the generic OTel + OTLP-HTTP-export plumbing.
otel = ["opentelemetry-sdk>=1.20,<2", "opentelemetry-exporter-otlp-proto-http>=1.20,<2"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # Exercises the pydantic-built response_format path (pydantic_response_format()).
    # pydantic is NOT a runtime dependency — it stays an optional install users opt into
    # by passing a BaseModel to response_format.
    "pydantic>=2",
    # Only needed by tests/test_byo_integration.py (the live-API integration
    # suite), to load the repo-root .env the same way the Node SDK's
    # jest.setup.ts does. No other test in this package touches the network.
    "python-dotenv>=1.0",
    # Exercises acruxcore.otel.register() (tests/test_otel.py) — same otel extra
    # a real user installs, plus one real instrumentor package so the framework
    # registry is checked against an actual importable class, not a mock.
    "opentelemetry-sdk>=1.20,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.20,<2",
    # OpenAIInstrumentor checks the `openai` package is importable before
    # instrumenting — no API key or network call needed for that check.
    "openinference-instrumentation-openai>=0.1",
    "openai>=1.69",
]

[project.urls]
Homepage = "https://acruxcore.com"
Documentation = "https://docs.acruxcore.com"
Repository = "https://github.com/AcruxCore/AcruxCore"

[tool.hatch.build.targets.wheel]
packages = ["src/acruxcore"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
