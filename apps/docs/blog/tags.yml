# Blog tags — deliberately kept to five.
#
# A Docusaurus tag page is a list of post titles with no content of its own, so
# a tag holding one or two posts produces a thin page that targets the same
# query as the post it links to. When Google picks the thin one, a searcher gets
# a list of two links instead of the article. Competitor-name tags (langfuse,
# opik, mlflow, …) were the worst case of this: /blog/tags/opik competed with
# the Opik comparison post for "opik alternative" and could never win it.
#
# Rules for adding to this file:
#  - A new tag needs three existing posts, or it stays out.
#  - No competitor names, no product names, no single generic words
#    ("performance", "comparison") — those carry no search intent alone and
#    exist only to compete with the posts.
#  - Three tags per post is the ceiling.
#
# Competitor and feature intent lives in each post's title, slug and `keywords`
# frontmatter, which is where it converts.

llmops-comparison:
  label: LLMOps comparison
  permalink: /llmops-comparison
  description: Head-to-head comparisons of LLMOps platforms, run hands-on rather than read off docs pages.

prompt-management:
  label: Prompt management
  permalink: /prompt-management
  description: Versioning prompts, promoting them between environments, and templating them without a redeploy.

llm-tracing:
  label: LLM tracing
  permalink: /llm-tracing
  description: Traces, spans, tool calls, and what an LLM run actually looks like in production.

llm-gateway:
  label: LLM gateway
  permalink: /llm-gateway
  description: One endpoint in front of every model provider — routing, caching, cost accounting, and virtual keys.

llm-latency:
  label: LLM latency
  permalink: /llm-latency
  description: Measured latency of LLMOps platforms and the overhead a gateway adds to a model call.
