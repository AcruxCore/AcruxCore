<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>AcruxCore — open-source LLMOps platform for engineering teams</title>
    <meta
      name="description"
      content="AcruxCore is an open-source, Apache-2.0, self-hostable LLMOps platform for engineering teams: version prompts, route LLM calls through an OpenAI-compatible gateway, trace every request, catalog tools, evaluate quality, and audit every change — one platform, no redeploy to change a prompt."
    />
    <meta
      name="keywords"
      content="llmops platform, open source llmops, llm ops, prompt management platform, llm gateway, ai gateway, llm observability platform, llm tracing, prompt versioning, llm evaluation platform, llm tool calling, tool catalog, openai compatible gateway, self-hosted llm observability, llm audit log, prompt audit trail"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <link rel="canonical" href="https://acruxcore.com/" />

    <!-- Icons. The .ico is first for clients that ignore SVG favicons, and because
         plenty of crawlers and unfurlers request /favicon.ico at the root regardless
         of what is declared here. Browsers that understand the SVG prefer it. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AcruxCore" />
    <meta property="og:title" content="AcruxCore — open-source LLMOps platform for engineering teams" />
    <meta
      property="og:description"
      content="Version prompts, route LLM calls, trace and evaluate — one platform. Ship, change, and measure LLM features without redeploying to move a prompt."
    />
    <meta property="og:url" content="https://acruxcore.com/" />
    <meta property="og:image" content="https://acruxcore.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AcruxCore — version prompts, route LLM calls, trace and evaluate." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AcruxCore — open-source LLMOps platform for engineering teams" />
    <meta
      name="twitter:description"
      content="Version prompts, route LLM calls, trace and evaluate — one platform. Ship, change, and measure LLM features without redeploying to move a prompt."
    />
    <meta name="twitter:image" content="https://acruxcore.com/og-image.png" />
    <meta name="twitter:image:alt" content="AcruxCore — version prompts, route LLM calls, trace and evaluate." />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "AcruxCore",
        "alternateName": "AcruxCore LLMOps Platform",
        "applicationCategory": "DeveloperApplication",
        "applicationSubCategory": "LLMOps platform",
        "operatingSystem": "Web",
        "url": "https://acruxcore.com/",
        "license": "https://www.apache.org/licenses/LICENSE-2.0",
        "isAccessibleForFree": true,
        "softwareHelp": "https://docs.acruxcore.com/",
        "codeRepository": "https://github.com/AcruxCore/AcruxCore",
        "description": "AcruxCore is an open-source, Apache-2.0, self-hostable LLMOps platform for engineering teams: version prompts, route LLM calls through an OpenAI-compatible gateway, trace every request, catalog tools, evaluate quality, and audit every change people make.",
        "featureList": [
          "Prompt versioning with named aliases and diffs",
          "Server-side prompt templating with conditionals and loops",
          "OpenAI-compatible AI gateway with automatic model fallbacks",
          "Virtual keys, budgets and per-key rate limits",
          "LLM tracing through the gateway or over OpenTelemetry",
          "Versioned tool catalog for function calling",
          "Offline experiments and online evaluation rules",
          "Prompt optimization with candidate rewrites you promote",
          "Team-wide audit trail of every change, on every plan and when self-hosted",
          "Audit events filtered by area, event or person, with the member who made each change"
        ],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script type="application/ld+json">
