# nginx config for the AcruxCore web container.
#
# Serves the built SPA and reverse-proxies /api to the API service so the
# browser reaches the backend same-origin (Bearer tokens ride through untouched,
# no CORS needed) — mirroring the Vite dev proxy.

# Canonical host is the apex, acruxcore.com — matching every <link
# rel="canonical"> the prerenderer emits and every URL in the sitemap. If www
# ever resolves (a DNS record added now or by a future hand), it must not serve
# the same pages under a second hostname: Google would treat www and apex as two
# separate sites and split their ranking signals. This block makes the apex the
# only host that ever serves content, no matter what DNS says.
#
# The redirect target is hardcoded to https:// rather than built from $scheme,
# because nginx terminates plain HTTP behind the Cloudflare proxy and $scheme
# would always read `http` here — sending Google to an insecure URL.
# HSTS value for the security header snippet (docker/security-headers.conf):
# set on acruxcore.com only. nginx omits a header whose value is empty, so a
# self-hosted install of this image on another domain never sends HSTS — that
# policy covers every subdomain of the host, and only the domain's owner can
# decide it. Behind Cloudflare, $host is the public hostname.
map $host $acx_hsts {
    acruxcore.com "max-age=31536000; includeSubDomains";
    default "";
}

# Content-Security-Policy for the pages this container serves itself: the
# marketing pages, the app shell and the 404 page. A map only so the one value
# can be named in the three locations below; it is the same for every host.
#
# Not in docker/security-headers.conf on purpose: that snippet also reaches the
# /blog/ proxy, whose Docusaurus pages run inline scripts this policy refuses.
#
# Line by line:
#   script-src  Our bundle and /runtime-config.js, plus gtag.js for GA4. No
#               'unsafe-inline' and no 'unsafe-eval': nothing in the page needs
#               either. The JSON-LD blocks are data, not script, so CSP skips
#               them, and Cloudflare's email-decode script is served from /cdn-cgi/
#               on this origin. Prompt templates render on the API, never here.
#   style-src   'unsafe-inline' because the prerendered pages carry style=""
#               attributes and <style> blocks. Styles cannot run code.
#   img-src     https: because the Preview shows image parts at whatever https
#               URL a prompt names, and GA4 sends image beacons.
#   connect-src https: because the Sentry ingest host comes from SENTRY_WEB_DSN at
#               container start, so no fixed list can name it, and GA4 posts to
#               regional hosts. img-src https: already allows a request to any
#               host, so a tighter list here would not stop one.
#   media-src   The landing page's demo video and its captions.
#   frame-ancestors 'none' matches X-Frame-Options: DENY.
map $host $acx_csp {
    default "default-src 'self'; script-src 'self' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' https://media.acruxcore.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 80;
    server_name www.acruxcore.com;

    return 301 https://acruxcore.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Emit relative `Location` headers on internal redirects (e.g. the directory
    # redirect /about -> /about/). nginx terminates plain HTTP behind the
    # Cloudflare proxy, so an absolute redirect would rebuild the URL as
    # `http://…` and downgrade an https request — an extra hop that Google
    # reports as a redirect chain, and an http URL competing with the canonical
    # https one.
    absolute_redirect off;

    # HSTS, nosniff, X-Frame-Options, Referrer-Policy and Permissions-Policy for
    # every response. Repeated inside each location below that has add_header
    # lines of its own, because those locations inherit none from here.
    include /etc/nginx/snippets/security-headers.conf;

    # Collapse a trailing slash so every page has exactly one address.
    #
    # Without this, /pricing/ resolves through `$uri/index.html` in the location
    # below and returns 200 with the same bytes as /pricing — so each prerendered
    # page has two working URLs. The <link rel="canonical"> tells Google which one
    # counts, but a canonical is a hint that still costs a crawl of the duplicate;
    # a 301 removes the second address instead of explaining it away.
    #
    # A regex location is matched ahead of the ordinary prefix locations below,
    # which is what lets this run before `location /` — and why /api/ and /assets/
    # are marked `^~`, so a prefix match there wins and their requests never reach
    # this block. `^(.+)/$` cannot match "/" itself (nothing precedes the slash),
    # so the landing page is untouched. `$is_args$args` is explicit because
    # `return` — unlike `rewrite` — does not carry the query string over.
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    # The /blog/ proxy to the blog's Cloudflare Pages project, written at
    # container start by docker/41-blog-proxy.sh only when BLOG_UPSTREAM is set.
    # A glob include that matches nothing is not an error, so a self-hosted
    # install without the variable gets the config exactly as it was.
    include /etc/nginx/acruxcore/blog-*.conf;

    # Static files and prerendered pages. Anything else is a real 404.
    #
    # The prerenderer writes /about as about/index.html, and `$uri/index.html`
    # serves that file directly, keeping the URL that the sitemap lists and the
    # page's own <link rel="canonical"> declares.
    #
    # There is deliberately no `$uri/` entry. On a directory it makes nginx 301
    # /x -> /x/, and the trailing-slash rule above sends /x/ straight back to /x —
    # an endless loop for every directory without its own index.html (/features,
    # which only holds the pillar pages, and /img). Every real page is already
    # caught by `$uri/index.html`, so such a path is a 404.
    #
    # The Link header (RFC 8288) tells an agent reading any public page where the
    # machine-readable resources are, without parsing HTML: the API catalog
    # below, the API reference, and llms.txt.
    location / {
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", <https://docs.acruxcore.com/api-reference>; rel="service-doc", </llms.txt>; rel="describedby"; type="text/markdown"';
        add_header Content-Security-Policy $acx_csp always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/index.html =404;
    }

    # Every 404 gets the prerendered "page not found" page, not nginx's bare one.
    # The page says noindex in its own <meta name="robots"> and has no canonical,
    # so a crawler gets the same answer from the status, the header and the HTML.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex" always;
        add_header Content-Security-Policy $acx_csp always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Dashboard and sign-in routes: the React app's own pages, which exist only
    # in the browser. They get dist/app-shell.html with a 200 — an empty #root
    # the app fills in, marked noindex in the HTML and in this header, with no
    # canonical link. The list must match the router in src/app/App.tsx;
    # src/app/spa-routes.test.ts fails when a route is added there and not here.
    #
    # A prefix, not every exact route: /prompts/<id> has an id nginx cannot
    # check, so the app shell answers anything under a known section, and the
    # React router shows its own "page not found" for a bad id inside it.
    #
    # A regex location, so it is checked in file order after the trailing-slash
    # rule above: /prompts/ still 301s to /prompts first.
    location ~ ^/(login|signup|auth/callback|verify-email|welcome|reset-password|invite|first-run|getting-started|prompts|team|account|gateway|tools|traces|sessions|observability|evaluations)(/.*)?$ {
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Content-Security-Policy $acx_csp always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /app-shell.html =404;
    }

    # The app shell has no address of its own; it is only ever served for the
    # routes above.
    location = /app-shell.html {
        internal;
    }

    # There is no features index page — only /features/<slug>. Someone who trims
    # a pillar URL to /features wants the list of pillars, which is the landing
    # page's #pillars section. 302, not 301: a browser caches a 301 for good, and
    # that would outlive a real /features page if one is ever added.
    location = /features {
        return 302 /#pillars;
    }

    # The API catalog (RFC 9727): a static linkset naming the API, its reference
    # docs and its health check. The file has no extension, so nginx would
    # otherwise send it as application/octet-stream. A missing file is a real 404.
    location = /.well-known/api-catalog {
        default_type 'application/linkset+json; profile="https://www.rfc-editor.org/info/rfc9727"';
        add_header Access-Control-Allow-Origin "*" always;
        add_header Link '</.well-known/api-catalog>; rel="api-catalog"' always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Every other /.well-known/ path is a probe for a discovery document (OAuth
    # metadata, MCP server card, …) that we do not publish. Answer 404, so an
    # agent learns "not here" from the status alone. `^~` keeps the
    # trailing-slash regex above from catching it.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # Proxy API calls to the backend container (service name `api`, port 3001).
    # `^~` so this prefix beats the trailing-slash regex above: an API path that
    # legitimately ends in a slash must reach the backend, not collect a 301.
    location ^~ /api/ {
        # Matches the API's own ingest ceiling. nginx defaults to 1m, so without
        # this a trace batch between 1MB and the API's limit was rejected here
        # with nginx's HTML 413 — which neither SDK can parse, and which never
        # reached the API's own JSON error at all.
        client_max_body_size 10m;

        # A gateway call may take up to the API's own 90 s ceiling before the
        # first byte (GATEWAY_CHAIN_DEADLINE_MS). nginx's 60 s default gave up
        # first and sent its HTML 504, which Cloudflare then replaced, so the
        # caller lost the API's JSON error and traceId (issue #732). Between
        # reads of a stream, the gateway's own idle limit is 60 s, also below this.
        proxy_read_timeout 120s;

        # The client address, which the API's sign-in rate limiter keys on. It
        # must be one the caller cannot choose, so it is worked out here and sent
        # as the only value of X-Forwarded-For (see $acx_client_ip at the end of
        # this file). First, step back over our own private-network hops: in
        # production the TCP peer is the host reverse proxy on the shared Docker
        # network, not Cloudflare, so $remote_addr becomes the address that
        # proxy received the connection from.
        set_real_ip_from 127.0.0.0/8;
        set_real_ip_from ::1/128;
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        set_real_ip_from 100.64.0.0/10;
        set_real_ip_from fc00::/7;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $acx_client_ip;
        proxy_set_header X-Forwarded-For $acx_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A client can send this header itself. Never pass the raw value on: when
        # the request did come through Cloudflare, $acx_client_ip already holds it.
        proxy_set_header CF-Connecting-IP "";
    }

    # Written at container start from the environment (Sentry DSN, GA4 ID), so
    # it changes on a restart without a new build. Never cache it, or a browser
    # or Cloudflare keeps serving the values from before.
    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # llms.txt is Markdown, and the Link header on every page says so
    # (type="text/markdown"). nginx's MIME map would send it as text/plain, so
    # the type is set here. A missing file is a real 404.
    location = /llms.txt {
        types { }
        default_type "text/markdown; charset=utf-8";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Long-cache the hashed static assets Vite emits under /assets/.
    # `^~` for the same reason as /api/ — asset requests skip the regex above.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }
}

# Whether the hop in front of our own network is a Cloudflare edge, which is the
# only case where CF-Connecting-IP is Cloudflare's and not the caller's. Read
# from $remote_addr after the /api/ location's set_real_ip_from has stepped back
# over our private hops. Cloudflare's published ranges,
# https://www.cloudflare.com/ips/ (checked 2026-11-11). A range Cloudflare adds
# later only costs its visitors a shared rate-limit bucket until it is listed.
geo $acx_via_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# The client address sent to the API: the visitor Cloudflare reports when the
# request came from a Cloudflare edge, otherwise the address that connected to
# us (or to our host reverse proxy). Falls back to that address too when a
# Cloudflare request somehow lacks the header, rather than sending an empty one.
map "$acx_via_cloudflare:$http_cf_connecting_ip" $acx_client_ip {
    "~^1:(?<acx_cf_ip>.+)$" $acx_cf_ip;
    default $remote_addr;
}
