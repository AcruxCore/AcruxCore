# Security response headers for every response the web container sends.
#
# Included at server level in apps/web/nginx.conf AND inside every location that
# has an add_header of its own: nginx drops all inherited add_header lines in a
# location that declares any, so a location that sets (say) Cache-Control would
# otherwise silently lose all five of these. apps/web/docker/test-headers.sh
# checks each such location.
#
# `always` so error responses (404, 413, 5xx) carry them too.

# Only sent on acruxcore.com — see the `map $host $acx_hsts` block at the top of
# nginx.conf. An empty value makes nginx omit the header entirely, so a
# self-hosted install on its own domain is never pinned to HTTPS by our image.
add_header Strict-Transport-Security $acx_hsts always;
add_header X-Content-Type-Options "nosniff" always;
# Nothing frames these pages: no page of ours embeds another in an <iframe>, and
# the dashboard holds a session worth protecting from clickjacking.
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Switch off the powerful browser features no page here uses.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;

# Proxied responses (the API, which sets its own through helmet, and the blog's
# Cloudflare Pages upstream, which sets nosniff and Referrer-Policy) would
# otherwise reach the browser with each header twice, once from upstream and
# once from above — and with two different X-Frame-Options values for the API.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
